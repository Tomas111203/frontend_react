server {
    listen 80;
    server_name localhost;

    # Ocultar huellas de Nginx
    server_tokens off;
    add_header Server "webserver" always;

    # ==========================================
    # CABECERAS DE SEGURIDAD (Nuclei Hardening)
    # ==========================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' http://localhost:8081 http://localhost:8000; img-src 'self' data: https:;" always;

    # Páginas de error genéricas (evita exponer la página predeterminada de Nginx)
    error_page 400 401 403 404 405 500 502 503 504 = @error_json;

    location @error_json {
        default_type application/json;
        return 404 '{"error": "Not Found"}';
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Reenviar llamadas a la API REST al backend FastAPI
    location /api/ {
        proxy_pass http://videogames-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Swagger / OpenAPI docs
    location /docs {
        proxy_pass http://videogames-api:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://videogames-api:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://videogames-api:8000;
        proxy_set_header Host $host;
    }

    # Servir el SPA de React para todo lo demás
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

